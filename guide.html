    <style>
        /* Titre principal : toujours sur une seule ligne, quelle que soit la taille d'écran */
        .guide-main-title { white-space: nowrap; font-size: clamp(1.4rem, 6.4vw, 42px); }

        /* Page d'accueil du guide : grille des soins */
        .guide-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .guide-service-card {
            cursor: pointer;
            text-align: center;
            align-items: center;
            justify-content: center;
            min-height: 160px;
        }
        .guide-service-card h3 { font-family: var(--font-titre); font-size: 26px; margin-bottom: 10px; }
        .guide-service-card .hint {
            font-family: var(--font-texte);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            border-bottom: 1px solid currentColor;
            padding-bottom: 2px;
            opacity: 0.85;
        }

        /* Vue détail d'un soin : image entière (jamais rognée ni zoomée), mais plafonnée */
        .guide-cover {
            max-width: 100%;
            width: auto;
            max-height: 380px;
            height: auto;
            display: block;
            border-radius: 16px;
            border: 1px solid var(--terracotta);
            box-shadow: 0 15px 35px var(--ombre-douce);
            margin: 0 auto 25px;
        }
        .guide-intro {
            font-family: var(--font-texte);
            font-size: 16px;
            line-height: 1.8;
            color: var(--noir-profond);
            max-width: 720px;
            margin: 0 auto;
            text-align: center;
        }

        .guide-items { display: flex; flex-direction: column; gap: 40px; margin-top: 45px; }
        .guide-item {
            display: flex;
            gap: 40px;
            align-items: center;
            background: var(--bg-carte);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px var(--ombre-douce);
        }
        .guide-item.reversed { flex-direction: row-reverse; }
        .guide-item-media {
            width: 38%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .guide-item-media img {
            max-width: 100%;
            max-height: 280px;
            width: auto;
            height: auto;
            display: block;
            border-radius: 12px;
        }
        .guide-item-text { flex: 1; text-align: left; }
        .guide-item.no-media .guide-item-text { text-align: center; }
        .guide-item-text h4 {
            font-family: var(--font-titre);
            font-size: 22px;
            color: var(--terracotta);
            margin-bottom: 12px;
        }
        .guide-item-text p {
            font-family: var(--font-texte);
            font-size: 15px;
            line-height: 1.8;
            color: var(--noir-profond);
        }
        .guide-cta { text-align: center; margin-top: 55px; }

        /* Ratio image / texte adapté à la taille de l'écran */
        @media (max-width: 992px) {
            .guide-item-media { width: 42%; }
            .guide-item-media img { max-height: 240px; }
        }
        @media (max-width: 768px) {
            .guide-cards { grid-template-columns: 1fr; }
            .guide-item, .guide-item.reversed { flex-direction: column; gap: 20px; text-align: center; }
            .guide-item-media { width: 100%; }
            .guide-item-media img { max-height: 320px; }
            .guide-item-text { text-align: center; }
            .guide-cover { max-height: 300px; }
        }
    </style>
</head>
